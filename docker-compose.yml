services:
  pgadmin:
    image: dpage/pgadmin4:9@sha256:3591b3d02910dcd817dec6fcaa681c278ba6966945283dd0ea0042731c330c83
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin@example.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-pgadmin-password}
      PGADMIN_DISABLE_POSTFIX: 1
      PGADMIN_LISTEN_PORT: 8080
    ports:
      - "18080:8080"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./docker/compose/pgadmin/servers.json:/pgadmin4/servers.json
  postgres:
    build:
      context: ./docker/compose/postgres
    image: europeana/portal.js-postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-password}
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/compose/postgres/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
      - ./docker/compose/postgres/model:/var/lib/postgresql/model
  redis:
    image: redis:8@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
    command: redis-server --appendonly yes
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data

volumes:
  pgadmin-data:
  postgres-data:
  redis-data:
