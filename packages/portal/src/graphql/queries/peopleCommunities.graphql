query PeopleCommunities(
  $locale: String!
  $preview: Boolean = false
  $skip: Int = 0
  $participation: [String] = []
  $communities: [String] = []
  $country: String = ""
) {
  personCollection(
    locale: $locale
    preview: $preview
    limit: 1000
    skip: $skip
    where: { AND: [
      { participation_contains_all: $participation }
      { country_contains: $country }
      { communities_contains_all: $communities }
      { communities_exists: true } 
    ]}
  ) {
    total
    items {
      communities
    }
  }
}
