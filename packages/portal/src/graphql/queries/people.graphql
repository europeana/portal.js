query People(
  $locale: String!
  $preview: Boolean = false
  $skip: Int = 0
  $limit: Int = 20,
  $order: [PersonOrder] = [name_ASC]
  $participation: [String] = []
  $query: String = ""
) {
  personCollection(
    locale: $locale
    preview: $preview
    order: $order
    limit: $limit
    skip: $skip
    where: { AND: [
      { participation_contains_all: $participation }
      { OR: [
        { name_contains: $query }
        { email_contains: $query }
      ]}
    ]}
  ) {
    total
    items {
       name
       country
       communities
       email
       url
    }
  }
}
