#import "../fragments/personFields.graphql"

query PeopleByGroup(
  $identifier: String!
  $locale: String!
  $preview: Boolean = false
  $skip: Int = 0
) {
  personGroupCollection(
    locale: $locale
    limit: 1
    preview: $preview
    where: { identifier: $identifier }
  ) {
    items {
      hasPartCollection(limit: 100, skip: $skip) {
        items {
          ... on Person {
            ...personFields
          }
        }
      }
    }
  }
}
