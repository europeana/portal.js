name: "Lokalise: push"

on:
  # TODO: also commits to main
  workflow_dispatch:
    inputs:
      force:
        description: 'Force upload of all base language strings. (Lokalise "rambo" mode.)'
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Push files to Lokalise
        uses: lokalise/lokalise-push-action@12fed75405fdb9812ef80bd9d9ef3d45cd5d70eb # v5.2.0
        with:
          api_token: ${{ secrets.LOKALISE_API_TOKEN_RW }}
          project_id: ${{ secrets.LOKALISE_PROJECT_ID }}
          file_ext: js
          translations_path: packages/portal/src/i18n/lang
          base_lang: en_GB
          flat_naming: true
          name_pattern: en.js
          use_tag_tracking: true
          rambo_mode: ${{ inputs.force }}
          additional_params: |
            cleanup_mode: true
